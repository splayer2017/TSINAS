<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>p2p-nube · Baúl</title>
<link rel="manifest" href="/manifest.json">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#111318;color:#e8eaf0;font-family:system-ui,Roboto,sans-serif}
header{padding:14px 16px;border-bottom:1px solid #262b36;position:sticky;top:0;background:#111318}
h1{font-size:18px;margin:0}
.sub{font-size:12px;color:#9aa3b2;margin-top:4px;word-break:break-all}
main{padding:12px 16px 40px;max-width:720px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center;margin:12px 0}
button{background:#2f6fed;border:0;color:#fff;border-radius:10px;padding:12px 16px;font-size:15px}
button.ghost{background:#1d2230}
#player{display:none;margin:12px 0}
video{width:100%;border-radius:12px;background:#000;max-height:46vh}
ul{list-style:none;margin:12px 0 0;padding:0}
li{background:#1a1f2b;border:1px solid #262b36;border-radius:12px;padding:12px;margin-bottom:10px}
li .t{font-weight:600;font-size:15px;word-break:break-all}
li .m{font-size:12px;color:#9aa3b2;margin:4px 0 8px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#333c52;margin-left:6px}
.err{background:#3a1d22;border:1px solid #7a2f3a;border-radius:10px;padding:10px;display:none;margin:8px 0;font-size:14px}
.hint{font-size:12px;color:#9aa3b2}
</style>
</head>
<body>
<header>
<h1>p2p-nube · Baúl</h1>
<div class="sub" id="info">conectando…</div>
</header>
<main>
<div class="row">
<button id="reload">Recargar lista</button>
<button id="home" class="ghost">Ocultar player</button>
</div>
<div class="err" id="err"></div>
<section id="player">
<video id="v" controls playsinline preload="metadata"></video>
<div class="hint" id="now"></div>
</section>
<ul id="list"></ul>
<p class="hint">Catálogo + lanzador: MP4 se reproduce aquí mismo; MKV (HEVC + FLAC) se abre en VLC fuera de Chrome, sin convertir (<span id="ns">Cache-Control: no-store</span>).</p>
</main>
<script>
const $=s=>document.querySelector(s);
function err(m){const e=$('#err');e.style.display='block';e.textContent=m;}
function clear(){const e=$('#err');e.style.display='none';}
function fmt(n){if(n>1e9)return (n/1e9).toFixed(1)+' GB';if(n>1e6)return (n/1e6).toFixed(1)+' MB';if(n>1e3)return (n/1e3).toFixed(0)+' KB';return n+' B';}
function isMkv(f){return (f.path||'').toLowerCase().endsWith('.mkv')||(f.mime||'').includes('matroska');}
function streamUrl(f){return location.origin+'/stream/'+f.hash;}
function vlcIntent(f){const scheme=location.protocol.replace(':','');const title=encodeURIComponent(f.path||'video');const fb=encodeURIComponent(streamUrl(f));return 'intent://'+location.host+'/stream/'+f.hash+'#Intent;action=android.intent.action.VIEW;scheme='+scheme+';package=org.videolan.vlc;type=video/*;S.title='+title+';S.browser_fallback_url='+fb+';end';}
async function copyUrl(f,btn){const u=streamUrl(f);try{await navigator.clipboard.writeText(u);btn.textContent='✓ Copiada';setTimeout(()=>btn.textContent='Copiar URL',1500);}catch(e){prompt('Copia la URL para VLC:',u);}}
async function info(){try{const r=await fetch('/api/info');const j=await r.json();$('#info').textContent='nodo '+j.endpoint_id.slice(0,12)+'… · '+j.files+' archivo(s)';}catch(e){$('#info').textContent='sin conexión con el host';}}
async function files(){clear();try{const r=await fetch('/api/files');if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const ul=$('#list');ul.innerHTML='';if(!j.length){ul.innerHTML='<li><div class="t">Vacío</div><div class="m">El host aún no marcó archivos para transmitir.</div></li>';return;}for(const f of j){const li=document.createElement('li');li.innerHTML='<div class="t"></div><div class="m"></div><div class="row"></div>';li.querySelector('.t').textContent=f.path;const sp=document.createElement('span');sp.className='badge';sp.textContent=f.policy;li.querySelector('.t').appendChild(sp);const web=document.createElement('span');web.className='badge';const mkv=isMkv(f);web.textContent=mkv?'Web: no · VLC: sí':'Web: sí';li.querySelector('.t').appendChild(web);li.querySelector('.m').textContent=fmt(f.size)+' · '+f.mime;const row=li.querySelector('.row');if(mkv){const note=document.createElement('div');note.className='hint';note.textContent='MKV HEVC + FLAC: Chrome no lo decodifica. Ábrelo en VLC.';li.appendChild(note);const a=document.createElement('a');a.href=vlcIntent(f);const b=document.createElement('button');b.textContent='Abrir en VLC';a.appendChild(b);row.appendChild(a);const c=document.createElement('button');c.className='ghost';c.textContent='Copiar URL';c.onclick=()=>copyUrl(f,c);row.appendChild(c);}else{const b=document.createElement('button');b.textContent='▶ Reproducir';b.onclick=()=>play(f);row.appendChild(b);const a=document.createElement('a');a.href=vlcIntent(f);a.style.marginLeft='8px';const v=document.createElement('button');v.className='ghost';v.textContent='VLC';a.appendChild(v);row.appendChild(a);}ul.appendChild(li);}}catch(e){err('No se pudo cargar la lista: '+e.message+' (¿host caído?)');}}
function play(f){clear();const v=$('#v');$('#player').style.display='block';$('#now').textContent=f.path+' · '+f.policy;v.src='/stream/'+f.hash;v.play().catch(()=>{});$('#player').scrollIntoView();}
$('#v').addEventListener('error',()=>{const v=$('#v');err('Error de reproducción (código '+(v.error?v.error.code:'?')+'). Si es 404 el host está offline; si es 416 pide otro rango.');});
$('#reload').onclick=()=>{info();files();};
$('#home').onclick=()=>{const v=$('#v');v.pause();v.removeAttribute('src');v.load();$('#player').style.display='none';};
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
info();files();
</script>
</body>
</html>
